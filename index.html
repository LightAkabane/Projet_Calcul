<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebGPU Crowdly</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">

  <!-- ONNX Runtime Web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <div class="badge">WebGPU</div>
    <h1 class="title">Crowdly</h1>
  </header>

  <div class="layout">
    <aside class="side">
      <img src="media/200w.gif" alt="Affiche lofi côté gauche">
    </aside>

    <section class="deck">
      <div class="card">
        <div class="controls">
          <div class="controls-left">
            <div id="vinyl" class="vinyl" title="Ambiance lofi"></div>
            <button id="btnPlay" class="btn btn-primary" type="button">▶︎ Play lofi</button>
            <button id="btnMute" class="btn" type="button">🔇 Mute</button>
          </div>
          <div style="display:flex;gap:10px;align-items:center">
            <label style="font-size:12px;color:var(--muted);">Confiance</label>
            <input id="thresh" type="range" min="0.2" max="0.95" step="0.01" value="0.60"/>
            <span id="threshVal" style="font-size:12px;color:var(--text);font-weight:700;min-width:36px;text-align:right">0.60</span>
          </div>
        </div>
        <div class="stage">
          <div id="container">
            <video id="video" autoplay playsinline></video>
            <canvas id="overlay"></canvas>
          </div>
        </div>
        <div class="hud">
          <div id="status">Initialisation...</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end">
            <div id="counter">👀 Personnes détectées : 0</div>
            <div id="unique-counter">🌟 Personnes uniques vues : 0</div>
          </div>
        </div>
      </div>
    </section>

    <aside class="side">
      <img src="media/200w2.gif" alt="Affiche lofi côté droit">
    </aside>
  </div>

  <audio id="lofiAudio" loop crossorigin="anonymous">
    <source src="media/song.mp3" type="audio/mpeg" />
  </audio>

  <div class="notes" aria-hidden="true">
    <div class="note">♪</div>
    <div class="note">♬</div>
    <div class="note">✦</div>
    <div class="note">♩</div>
    <div class="note">☾</div>
  </div>

  <!-- ⚠️ IMPORTANT: type="module" pour utiliser les import/export -->
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/audio.js"></script>
  <script type="module" src="js/camera.js"></script>
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/detection.js"></script>
  <script type="module" src="js/reid.js"></script>
  <script type="module" src="js/rendering.js"></script>
  <script type="module" src="js/tracking.js"></script>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
